<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 游戏手柄背景圆 -->
  <circle cx="60" cy="60" r="56" fill="#1a1a2e" stroke="#e94560" stroke-width="3"/>
  
  <!-- 手柄主体 -->
  <rect x="30" y="48" width="60" height="24" rx="6" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <rect x="28" y="35" width="10" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <rect x="82" y="35" width="10" height="50" rx="5" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  
  <!-- D-pad -->
  <circle cx="48" cy="60" r="8" fill="#533483"/>
  <rect x="45" y="56" width="6" height="8" rx="1" fill="#e94560"/>
  <rect x="42" y="58" width="12" height="4" rx="1" fill="#e94560"/>
  
  <!-- Button -->
  <circle cx="72" cy="60" r="7" fill="#533483"/>
  <circle cx="72" cy="60" r="3" fill="#ffd700"/>
  
  <!-- 文字 -->
  <text x="60" y="105" text-anchor="middle" fill="#ffffff" font-size="10" font-family="Arial" font-weight="bold">PRO</text>
  <text x="60" y="116" text-anchor="middle" fill="#888888" font-size="7" font-family="Arial">MAX</text>
</svg>
